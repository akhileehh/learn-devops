---
- name: provisioning servers
  hosts: all
  become: yes
  tasks:
    - name: install ntp agent on centos 
      yum:
        name: ""{{item}}
        state: present
      when: ansible_distribution == "CentOS"
      loop:
        - chrony
        - wget
        - unzip
        - zip
    - name: install ntp on ubuntu
      apt:
        name: ""{{item}}
        state: present
        update_cache: yes # it run apt update and apt install these are good to avoid dependency errors
       when: ansible_distribution == "Ubuntu"
       loop:
        - ntp
        - wget
        - unzip
        - zip
    - name: start service on CentOS
      service:
        name: chronyd
        state: started
        enabled: yes
      when: ansible_distribution == "CentOS"  
    - name: start service on Ubuntu
      service:
        name: ntp
        state: started
        enabled: yes
      when: ansible_distribution == "Ubuntu"    
