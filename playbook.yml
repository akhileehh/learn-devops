this is a basic ansible playbook to install httpd and mariadb
> configuration tools like ansible are idempotent (only apply changes when target is different )
to run[ansible-playbook -i <inventory> <name of playbook.yml]
> ansible-playbook -i inventory playbook.yml -C              >>>> Dry run
> ansible-playbook -i inventory playbook.yml --syntax-check  >>>> checks syntax
---
-name: Webserver setup
 hosts: webservers
 become: yes
 tasks:
  - name: Install httpd 
    ansible.builtin.yum:
      name: httpd
      state : present
  -name: Start service
    ansible.builtin.service:
      name: httpd
      state: started
      enabled: yes
-name: DBserver setup
 hosts: dbservers
 become: yes
 tasks:
   - name: Install mariadb-server
     ansible.builtin.yum:
       name: mariadb-server
       state: present
   -name: Start service
    ansible.builtin.service:
      name: mariadb
      state: started
      enabled: yes
